<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function createUI() {
        // JS Code to create Button and Ordered List

        var buttonDomElement = document.createElement("button");
        buttonDomElement.innerText = "JS Button";
        document.querySelector("body").append(buttonDomElement);

        //ol , li's , li-content, li-ol,ol,body

        var ol = document.createElement("ol");
        var li1 = document.createElement("li");
        var li2 = document.createElement("li");

        li1.innerText = "React JS";
        li2.innerText = "Next JS";

        ol.appendChild(li1);
        ol.appendChild(li2);

        document.querySelector("body").appendChild(ol);
      }

      createUI();
      createUI();
      createUI();
    </script>
  </body>
</html>
